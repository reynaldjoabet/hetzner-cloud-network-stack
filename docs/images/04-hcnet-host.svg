  <text x="450" y="150" text-anchor="middle" font-weight="bold" fill="#1b1f27">hcnet eBPF data plane (in kernel)</text>
  <text x="450" y="170" text-anchor="middle" font-size="12" fill="#5b6475">routing · anti-spoof · private networks · built-in DHCP + metadata (169.254.169.254, fe80::a9fe:a9fe)</text>

  <line x1="250" y1="185" x2="200" y2="220" stroke="#5b6475"/>
