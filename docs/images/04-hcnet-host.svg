  <text x="200" y="262" text-anchor="middle" font-size="12" fill="#5b6475">own conntrack 120k v4 + 120k v6</text>
  <rect x="360" y="220" width="180" height="58" rx="6" fill="#e6f4f1" stroke="#0f7b6c"/>
  <text x="450" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b1f27">Firewall program</text>
  <text x="450" y="262" text-anchor="middle" font-size="12" fill="#5b6475">verified + JIT-compiled</text>
  <rect x="610" y="220" width="180" height="58" rx="6" fill="#ffffff" stroke="#c9d0db" stroke-dasharray="4 3"/>
  <text x="700" y="244" text-anchor="middle" font-size="13" fill="#1b1f27">no firewall</text>
  <text x="700" y="262" text-anchor="middle" font-size="12" fill="#5b6475">no conntrack at all</text>

