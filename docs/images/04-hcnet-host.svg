  <rect x="300" y="50" width="300" height="46" rx="6" fill="#ffffff" stroke="#c9d0db"/>
  <text x="450" y="78" text-anchor="middle" fill="#1b1f27">Uplinks + Linux routing</text>
  <line x1="450" y1="96" x2="450" y2="125" stroke="#5b6475" marker-end="url(#arr)"/>

