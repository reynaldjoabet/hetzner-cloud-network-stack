<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="900" height="420" fill="#ffffff"/>

  <!-- ============ LEFT: LACP bond ============ -->
  <text x="30" y="30" font-size="16" font-weight="bold" fill="#1b1f27">LACP bond to a switch pair</text>
  <text x="30" y="48" font-size="12" fill="#6b7a90">older Hetzner hosts</text>

  <rect x="45" y="62" width="380" height="64" rx="8" fill="none" stroke="#6b7a90" stroke-dasharray="5 4"/>
  <text x="235" y="78" text-anchor="middle" font-size="11" fill="#6b7a90">act as ONE logical switch (virtual chassis / MLAG)</text>
  <rect x="60" y="84" width="140" height="34" rx="6" fill="#eef1f5" stroke="#c9d0db"/>
  <text x="130" y="106" text-anchor="middle" fill="#1b1f27">Switch A</text>
  <rect x="270" y="84" width="140" height="34" rx="6" fill="#eef1f5" stroke="#c9d0db"/>
  <text x="340" y="106" text-anchor="middle" fill="#1b1f27">Switch B</text>
  <line x1="200" y1="101" x2="270" y2="101" stroke="#b00a26" stroke-width="3"/>
  <text x="235" y="140" text-anchor="middle" font-size="11" fill="#b00a26">shared state</text>

  <rect x="45" y="160" width="380" height="200" rx="10" fill="none" stroke="#6b7a90" stroke-width="1.5"/>
  <text x="60" y="180" font-family="Menlo, monospace" font-size="11" fill="#6b7a90">HOST</text>
  <rect x="75" y="192" width="110" height="32" rx="6" fill="#ffffff" stroke="#c9d0db"/>
  <text x="130" y="213" text-anchor="middle" fill="#1b1f27">eth0 10G</text>
  <rect x="285" y="192" width="110" height="32" rx="6" fill="#ffffff" stroke="#c9d0db"/>
  <text x="340" y="213" text-anchor="middle" fill="#1b1f27">eth1 10G</text>
  <line x1="130" y1="118" x2="130" y2="192" stroke="#5b6475" stroke-width="2"/>
  <line x1="340" y1="118" x2="340" y2="192" stroke="#5b6475" stroke-width="2"/>
  <line x1="130" y1="224" x2="200" y2="250" stroke="#5b6475"/>
  <line x1="340" y1="224" x2="270" y2="250" stroke="#5b6475"/>
  <rect x="125" y="250" width="220" height="44" rx="6" fill="#eef1f5" stroke="#6b7a90" stroke-width="1.5"/>
  <text x="235" y="268" text-anchor="middle" font-weight="bold" fill="#1b1f27">bond0  (802.3ad)</text>
  <text x="235" y="285" text-anchor="middle" font-size="11" fill="#5b6475">one IP, one MAC, 20G total</text>
  <line x1="235" y1="294" x2="235" y2="312" stroke="#5b6475"/>
  <rect x="155" y="312" width="160" height="32" rx="6" fill="#ffffff" stroke="#c9d0db"/>
  <text x="235" y="333" text-anchor="middle" fill="#1b1f27">routing → OVS → VMs</text>

  <text x="30" y="388" font-size="12" fill="#5b6475">One logical link: simple for the host, but the two switches</text>
  <text x="30" y="404" font-size="12" fill="#5b6475">are coupled and can fail or need upgrading together.</text>

  <!-- ============ RIGHT: BGP ============ -->
  <text x="470" y="30" font-size="16" font-weight="bold" fill="#1b1f27">Two routed BGP uplinks</text>
  <text x="470" y="48" font-size="12" fill="#0f7b6c">newer Hetzner hosts</text>

  <rect x="485" y="84" width="140" height="34" rx="6" fill="#eef1f5" stroke="#c9d0db"/>
  <text x="555" y="106" text-anchor="middle" fill="#1b1f27">Switch A</text>
  <rect x="725" y="84" width="140" height="34" rx="6" fill="#eef1f5" stroke="#c9d0db"/>
  <text x="795" y="106" text-anchor="middle" fill="#1b1f27">Switch B</text>
  <text x="675" y="106" text-anchor="middle" font-size="11" fill="#0f7b6c">independent</text>

  <rect x="470" y="160" width="410" height="200" rx="10" fill="none" stroke="#0f7b6c" stroke-width="1.5"/>
  <text x="485" y="180" font-family="Menlo, monospace" font-size="11" fill="#0f7b6c">HOST</text>
  <rect x="500" y="192" width="110" height="32" rx="6" fill="#ffffff" stroke="#c9d0db"/>
  <text x="555" y="213" text-anchor="middle" fill="#1b1f27">eth0 10G</text>
  <rect x="740" y="192" width="110" height="32" rx="6" fill="#ffffff" stroke="#c9d0db"/>
  <text x="795" y="213" text-anchor="middle" fill="#1b1f27">eth1 10G</text>
  <line x1="555" y1="118" x2="555" y2="192" stroke="#5b6475" stroke-width="2"/>
  <line x1="795" y1="118" x2="795" y2="192" stroke="#5b6475" stroke-width="2"/>
  <text x="563" y="152" font-size="11" fill="#0f7b6c">BGP session</text>
  <text x="803" y="152" font-size="11" fill="#0f7b6c">BGP session</text>
  <line x1="555" y1="224" x2="620" y2="250" stroke="#5b6475"/>
  <line x1="795" y1="224" x2="730" y2="250" stroke="#5b6475"/>
  <rect x="510" y="250" width="330" height="44" rx="6" fill="#e6f4f1" stroke="#0f7b6c" stroke-width="1.5"/>
  <text x="675" y="268" text-anchor="middle" font-weight="bold" fill="#1b1f27">Linux routing (ECMP)</text>
  <text x="675" y="285" text-anchor="middle" font-size="11" fill="#5b6475">default via A and via B · announce VM IPs to both</text>
  <line x1="675" y1="294" x2="675" y2="312" stroke="#5b6475"/>
  <rect x="580" y="312" width="190" height="32" rx="6" fill="#ffffff" stroke="#c9d0db"/>
  <text x="675" y="333" text-anchor="middle" fill="#1b1f27">OVS or hcnet → VMs</text>

  <text x="470" y="388" font-size="12" fill="#5b6475">Two separate links: either switch can fail or be upgraded</text>
  <text x="470" y="404" font-size="12" fill="#5b6475">on its own; BGP withdraws the route in seconds.</text>
</svg>
