<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6475"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d50c2d"/></marker>
  </defs>
  <rect width="900" height="470" fill="#ffffff"/>

  <rect x="250" y="10" width="160" height="44" rx="6" fill="#eef1f5" stroke="#c9d0db"/>
  <text x="330" y="37" text-anchor="middle" fill="#1b1f27">Switch A</text>
  <rect x="490" y="10" width="160" height="44" rx="6" fill="#eef1f5" stroke="#c9d0db"/>
  <text x="570" y="37" text-anchor="middle" fill="#1b1f27">Switch B</text>

  <rect x="30" y="80" width="840" height="375" rx="10" fill="none" stroke="#6b7a90" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="48" y="104" font-family="Menlo, monospace" font-size="12" fill="#6b7a90">PHYSICAL HOST · standard stack (OVS)</text>
  <line x1="330" y1="54" x2="410" y2="120" stroke="#5b6475" marker-end="url(#arr)"/>
  <line x1="570" y1="54" x2="490" y2="120" stroke="#5b6475" marker-end="url(#arr)"/>
  <text x="450" y="78" text-anchor="middle" font-size="12" fill="#5b6475">2 × 10 Gb/s (LACP bond / BGP)</text>

  <rect x="330" y="120" width="240" height="46" rx="6" fill="#ffffff" stroke="#c9d0db"/>
  <text x="450" y="148" text-anchor="middle" fill="#1b1f27">Linux routing (host kernel)</text>
  <line x1="450" y1="166" x2="450" y2="200" stroke="#5b6475" marker-end="url(#arr)"/>

  <rect x="200" y="200" width="500" height="74" rx="8" fill="#ffffff" stroke="#6b7a90" stroke-width="2"/>
  <text x="450" y="228" text-anchor="middle" font-weight="bold" fill="#1b1f27">Open vSwitch bridge</text>
  <text x="450" y="250" text-anchor="middle" font-size="12" fill="#5b6475">OpenFlow tables: MAC check · IP/ARP anti-spoof · firewall · VXLAN</text>
  <text x="450" y="266" text-anchor="middle" font-size="12" fill="#5b6475">+ netfilter conntrack (shared table, ctcount caps 80k per server)</text>

  <rect x="720" y="130" width="130" height="60" rx="6" fill="#eef1f5" stroke="#c9d0db"/>
  <text x="785" y="156" text-anchor="middle" font-weight="bold" fill="#1b1f27">Flusskrebs</text>
  <text x="785" y="174" text-anchor="middle" font-size="12" fill="#5b6475">controller</text>
  <path d="M760,190 L700,222" stroke="#d50c2d" stroke-dasharray="4 3" fill="none" marker-end="url(#arrR)"/>
  <text x="770" y="214" font-size="12" fill="#d50c2d">installs flows</text>

  <rect x="50" y="200" width="130" height="74" rx="6" fill="#eef1f5" stroke="#c9d0db"/>
  <text x="115" y="226" text-anchor="middle" font-size="13" fill="#1b1f27">Per-VM netns</text>
  <text x="115" y="244" text-anchor="middle" font-size="12" fill="#5b6475">udhcpd (DHCP)</text>
  <text x="115" y="260" text-anchor="middle" font-size="12" fill="#5b6475">169.254.169.254</text>
  <line x1="180" y1="237" x2="200" y2="237" stroke="#5b6475"/>

  <line x1="290" y1="274" x2="200" y2="340" stroke="#5b6475"/>
  <line x1="450" y1="274" x2="450" y2="340" stroke="#5b6475"/>
  <line x1="610" y1="274" x2="700" y2="340" stroke="#5b6475"/>
  <rect x="120" y="340" width="160" height="90" rx="8" fill="#ffffff" stroke="#c9d0db"/>
  <text x="200" y="368" text-anchor="middle" font-weight="bold" fill="#1b1f27">VM 1</text>
  <text x="200" y="390" text-anchor="middle" font-size="12" fill="#5b6475">eth0 public</text>
  <text x="200" y="408" text-anchor="middle" font-size="12" fill="#5b6475">ens10 private</text>
  <rect x="370" y="340" width="160" height="90" rx="8" fill="#ffffff" stroke="#c9d0db"/>
  <text x="450" y="368" text-anchor="middle" font-weight="bold" fill="#1b1f27">VM 2</text>
  <text x="450" y="390" text-anchor="middle" font-size="12" fill="#5b6475">1 public + up to</text>
  <text x="450" y="408" text-anchor="middle" font-size="12" fill="#5b6475">3 private NICs</text>
  <rect x="620" y="340" width="160" height="90" rx="8" fill="#ffffff" stroke="#c9d0db"/>
  <text x="700" y="368" text-anchor="middle" font-weight="bold" fill="#1b1f27">VM 3</text>
  <text x="700" y="390" text-anchor="middle" font-size="12" fill="#5b6475">…</text>
</svg>
